apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()

    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Only the local signing process supplies these values; nothing is stored in source.
def releaseSigningEnvironment = [
    storeFile: providers.environmentVariable('SPARTAN_RELEASE_STORE_FILE').orNull,
    keyAlias: providers.environmentVariable('SPARTAN_RELEASE_KEY_ALIAS').orNull,
    storePassword: providers.environmentVariable('SPARTAN_RELEASE_STORE_PASSWORD').orNull,
    keyPassword: providers.environmentVariable('SPARTAN_RELEASE_KEY_PASSWORD').orNull,
]
// Public certificate identity, not private key material.
def expectedReleaseCertificateSha256 = 'd0ae97095e6dc78dfe83f1f60c02e9eb40b67b28810a592be8b6a0a368e4433f'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.spartang.mobile'
    defaultConfig {
        applicationId 'com.spartang.mobile'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeType 'PKCS12'
            if (releaseSigningEnvironment.storeFile) storeFile file(releaseSigningEnvironment.storeFile)
            if (releaseSigningEnvironment.keyAlias) keyAlias releaseSigningEnvironment.keyAlias
            if (releaseSigningEnvironment.storePassword) storePassword releaseSigningEnvironment.storePassword
            if (releaseSigningEnvironment.keyPassword) keyPassword releaseSigningEnvironment.keyPassword
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false)
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// This verification task never compiles, packages or installs an APK.
def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Verify external release credentials and the dedicated public certificate.'
    notCompatibleWithConfigurationCache('Release credentials must remain in the local signing process.')
    doLast {
        def missing = releaseSigningEnvironment.findAll { name, value -> !value?.trim() }.keySet()
        if (!missing.isEmpty()) {
            throw new GradleException('Dedicated release signing credentials are missing. Use the protected local signing workflow; debug signing is not a fallback.')
        }
        def releaseStore = new File(releaseSigningEnvironment.storeFile)
        def sourceCheckout = new File(rootDir, '../../..').canonicalFile.toPath()
        if (!releaseStore.isAbsolute() || !releaseStore.isFile()
                || releaseStore.canonicalFile.toPath().startsWith(sourceCheckout)) {
            throw new GradleException('Dedicated release keystore must be an existing absolute path outside the source checkout.')
        }
        char[] storeSecret = releaseSigningEnvironment.storePassword.toCharArray()
        char[] entrySecret = releaseSigningEnvironment.keyPassword.toCharArray()
        try {
            def keyStore = java.security.KeyStore.getInstance('PKCS12')
            releaseStore.withInputStream { stream -> keyStore.load(stream, storeSecret) }
            def alias = releaseSigningEnvironment.keyAlias
            def certificate = keyStore.getCertificate(alias)
            if (!(certificate instanceof java.security.cert.X509Certificate) || !keyStore.isKeyEntry(alias)) {
                throw new GradleException('Dedicated release signing entry is invalid.')
            }
            certificate.checkValidity()
            def fingerprint = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
            if (fingerprint != expectedReleaseCertificateSha256) {
                throw new GradleException('Dedicated release certificate does not match the approved public fingerprint; debug and replacement keys are rejected.')
            }
            def privateKey = keyStore.getKey(alias, entrySecret)
            if (!(privateKey instanceof java.security.interfaces.RSAPrivateKey)
                    || privateKey.modulus.bitLength() < 3072) {
                throw new GradleException('Dedicated release signing key is invalid.')
            }
            byte[] challenge = new byte[32]
            new java.security.SecureRandom().nextBytes(challenge)
            def proof = java.security.Signature.getInstance('SHA256withRSA')
            proof.initSign(privateKey)
            proof.update(challenge)
            def signature = proof.sign()
            proof.initVerify(certificate.publicKey)
            proof.update(challenge)
            if (!proof.verify(signature)) throw new GradleException('Dedicated release signing proof failed.')
            logger.lifecycle('Dedicated release signing verified (public certificate SHA-256: ' + fingerprint + ').')
        } catch (GradleException error) {
            throw error
        } catch (Exception ignored) {
            throw new GradleException('Unable to unlock or verify the dedicated release key. Check protected credentials; secret values are omitted.')
        } finally {
            java.util.Arrays.fill(storeSecret, (char) 0)
            java.util.Arrays.fill(entrySecret, (char) 0)
        }
    }
}
tasks.configureEach { task ->
    if (task.name in ['preReleaseBuild', 'validateSigningRelease']) {
        task.dependsOn(verifyReleaseSigning)
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // App Check only; native Auth/Firestore and existing networking remain unchanged.
    implementation("com.google.firebase:firebase-appcheck-playintegrity:19.4.1")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply plugin: 'com.google.gms.google-services'
